# Local development only (production uses 3 separate Dockerfile resources in Coolify)
version: '3.8'

services:
  # Frontend - Next.js
  frontend-nextjs:
    build:
      context: ./apps/frontend-nextjs
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_WS_GAME_URL=${NEXT_PUBLIC_WS_GAME_URL}
      - NEXT_PUBLIC_WS_WEBRTC_URL=${NEXT_PUBLIC_WS_WEBRTC_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - CLOUDFLARE_TURN_KEY_ID=${CLOUDFLARE_TURN_KEY_ID}
      - CLOUDFLARE_TURN_API_TOKEN=${CLOUDFLARE_TURN_API_TOKEN}
    depends_on:
      - backend-websockets
      - backend-webrtc
    networks:
      - funfram-network
    restart: unless-stopped

  # Backend - WebSocket Server (Go)
  backend-websockets:
    build:
      context: ./apps/backend-websockets
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL:-}
    networks:
      - funfram-network
    restart: unless-stopped

  # Backend - WebRTC Signaling Server (Node.js)
  backend-webrtc:
    build:
      context: ./apps/backend-webrtc
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - METERED_DOMAIN=${METERED_DOMAIN:-}
      - METERED_API_KEY=${METERED_API_KEY:-}
    networks:
      - funfram-network
    restart: unless-stopped

networks:
  funfram-network:
    driver: bridge


