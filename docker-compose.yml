version: '3.8'

services:
  # Frontend - Next.js
  frontend-nextjs:
    build:
      context: ./apps/frontend-nextjs
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_WS_GAME_URL=${NEXT_PUBLIC_WS_GAME_URL}
      - NEXT_PUBLIC_WS_WEBRTC_URL=${NEXT_PUBLIC_WS_WEBRTC_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    depends_on:
      - backend-websockets
      - backend-webrtc
    networks:
      - funfram-network
    restart: unless-stopped

  # Backend - WebSocket Server (Go)
  backend-websockets:
    build:
      context: ./apps/backend-websockets
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL:-}
    networks:
      - funfram-network
    restart: unless-stopped

  # Backend - WebRTC Signaling Server (Node.js)
  backend-webrtc:
    build:
      context: ./apps/backend-webrtc
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - TURN_SERVER_URL=${TURN_SERVER_URL:-}
      - TURN_USERNAME=${TURN_USERNAME:-funfram}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-funfram_secret}
    networks:
      - funfram-network
    restart: unless-stopped

  # TURN Server - Coturn (Local TURN Server)
  coturn:
    image: coturn/coturn:4.6.2
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    network_mode: "host"
    environment:
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP}
    restart: unless-stopped
  # Nginx Reverse Proxy (Optional - not needed with Cloudflare tunneling)
  # Comment out this service if using Cloudflare tunneling
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend-nextjs
  #     - backend-websockets
  #     - backend-webrtc
  #   networks:
  #     - funfram-network
  #   restart: unless-stopped
  #   profiles:
  #     - without-cloudflare

networks:
  funfram-network:
    driver: bridge
