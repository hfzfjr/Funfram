version: '3.8'

services:
  # Frontend - Next.js
  frontend-nextjs:
    build:
      context: ./apps/frontend-nextjs
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_WS_GAME_URL=${NEXT_PUBLIC_WS_GAME_URL}
      - NEXT_PUBLIC_WS_WEBRTC_URL=${NEXT_PUBLIC_WS_WEBRTC_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    depends_on:
      - backend-websockets
      - backend-webrtc
    networks:
      - funfram-network
    restart: unless-stopped

  # Backend - WebSocket Server (Go)
  backend-websockets:
    build:
      context: ./apps/backend-websockets
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL:-}
    networks:
      - funfram-network
    restart: unless-stopped

  # Backend - WebRTC Signaling Server (Node.js)
  backend-webrtc:
    build:
      context: ./apps/backend-webrtc
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - TURN_SERVER_URL=${TURN_SERVER_URL:-}
      - TURN_USERNAME=${TURN_USERNAME:-funfram}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-funfram_secret}
    networks:
      - funfram-network
    restart: unless-stopped

  # TURN Server - Coturn (Local TURN Server)
  # TURN Server - Coturn (Local TURN Server)
  coturn:
    image: coturn/coturn:4.6.2
    network_mode: "host"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    command:
      - turnserver
      - -n
      - --listening-port=3478
      - --tls-port=5349
      - --listening-ip=0.0.0.0
      - --external-ip=182.253.158.158
      - --relay-ip=192.168.0.8
      - --fingerprint
      - --lt-cred-mech
      - --user=funfram:letsgooo_Funfram
      - --realm=funfram.roomify.space
      - --min-port=49152
      - --max-port=65535
      - --log-file=stdout
      - --no-stdout-log
      - --no-cli

networks:
  funfram-network:
    driver: bridge
