version: '3.8'

services:
  # Frontend - Next.js
  frontend-nextjs:
    build:
      context: ./apps/frontend-nextjs
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_WS_GAME_URL=${NEXT_PUBLIC_WS_GAME_URL}
      - NEXT_PUBLIC_WS_WEBRTC_URL=${NEXT_PUBLIC_WS_WEBRTC_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    depends_on:
      - backend-websockets
      - backend-webrtc
    networks:
      - funfram-network
    restart: unless-stopped

  # Backend - WebSocket Server (Go)
  backend-websockets:
    build:
      context: ./apps/backend-websockets
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL:-}
    networks:
      - funfram-network
    restart: unless-stopped

  # Backend - WebRTC Signaling Server (Node.js)
  backend-webrtc:
    build:
      context: ./apps/backend-webrtc
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - TURN_SERVER_URL=${TURN_SERVER_URL:-}
      - TURN_USERNAME=${TURN_USERNAME:-funfram}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-funfram_secret}
      - METERED_DOMAIN=${METERED_DOMAIN:-}
      - METERED_API_KEY=${METERED_API_KEY:-}
    networks:
      - funfram-network
    restart: unless-stopped

  # TURN Server - Coturn (Self-Hosted)
  coturn:
    image: coturn/coturn:4.6.2
    network_mode: "host"
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./infrastructure/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - TURN_USERNAME=${TURN_USERNAME}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL}
      - SERVER_PUBLIC_IP=${SERVER_PUBLIC_IP}
    command:
      - turnserver
      - -c
      - /etc/coturn/turnserver.conf

networks:
  funfram-network:
    driver: bridge
