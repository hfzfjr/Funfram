name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, funfram]
    timeout-minutes: 30
    steps:
      - name: Jalankan deploy.sh
        run: bash /home/funfram/Funfram/deploy.sh