# Coturn TURN Server Configuration

# Listening ports
listening-port=3478
listening-port=5349

# TLS support
fingerprint
lt-cred-mech
no-tlsv1
no-tlsv1_1

# User authentication
user=funfram:funfram_secret
realm=funfram.com

# External IP (replace with your server's public IP)
# external-ip=YOUR_PUBLIC_IP

# Logging
log-file=stdout
no-stdout-log

# Network
no-cli
